services:
  - type: web
    name: disasterroute
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    envVars:
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /opt/render/project/src/.model_cache
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////opt/render/project/src/backend/disasterroute.db
