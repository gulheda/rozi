services:
  - type: web
    name: rozi
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: MERKEZ_PHONE_NUMBER
        sync: false
      - key: DUPLICATE_THRESHOLD
        value: "0.85"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./disasterroute.db"
      - key: PYTHON_VERSION
        value: "3.11.9"
